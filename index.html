<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio HZ — Arquitectura · Buenos Aires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #0a0a0a; --white: #f5f4f0; --gray: #8a8880; --line: rgba(255,255,255,0.1); }
  html { scroll-behavior: smooth; }
  body { background: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 300; min-height: 100vh; overflow-x: hidden; }
  .container { max-width: 480px; margin: 0 auto; padding: 0 28px; }
  header { padding: 64px 0 48px; opacity: 0; animation: fadeUp 1s ease 0.1s forwards; }
  .logo-mark { width: 56px; height: 56px; border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
  .logo-mark span { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.05em; color: var(--white); }
  .studio-name { font-family: 'Cormorant', serif; font-weight: 300; font-size: clamp(36px, 8vw, 48px); line-height: 1; letter-spacing: -0.01em; margin-bottom: 10px; }
  .studio-sub { font-size: 11px; letter-spacing: 0.2em; color: var(--gray); text-transform: uppercase; }
  .divider { width: 100%; height: 1px; background: var(--line); margin: 40px 0; opacity: 0; animation: fadeUp 1s ease 0.3s forwards; }
  .tagline { font-family: 'Cormorant', serif; font-style: italic; font-weight: 300; font-size: clamp(18px, 4vw, 22px); color: rgba(245,244,240,0.55); line-height: 1.5; margin-bottom: 40px; opacity: 0; animation: fadeUp 1s ease 0.4s forwards; }
  .links { display: flex; flex-direction: column; gap: 1px; opacity: 0; animation: fadeUp 1s ease 0.55s forwards; }
  .link-item { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--white); transition: color 0.2s ease; cursor: pointer; }
  .link-item:first-child { border-top: 1px solid var(--line); }
  .link-item:hover { color: var(--gray); }
  .link-item:hover .arrow { transform: translate(3px, -3px); }
  .link-label { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
  .link-desc { font-family: 'Cormorant', serif; font-style: italic; font-size: 14px; color: var(--gray); margin-top: 3px; }
  .arrow { font-size: 16px; color: var(--gray); transition: transform 0.2s ease; flex-shrink: 0; margin-left: 16px; }
  .contact-section { padding: 48px 0 32px; opacity: 0; animation: fadeUp 1s ease 0.7s forwards; }
  .contact-label { font-size: 10px; letter-spacing: 0.25em; color: var(--gray); text-transform: uppercase; margin-bottom: 16px; }
  .instagram-link { font-size: 12px; letter-spacing: 0.1em; color: var(--gray); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
  .instagram-link:hover { color: var(--white); }
  footer { padding: 32px 0 48px; opacity: 0; animation: fadeUp 1s ease 0.85s forwards; }
  .footer-text { font-size: 10px; letter-spacing: 0.15em; color: rgba(138,136,128,0.5); text-transform: uppercase; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-mark"><span>HZ</span></div>
    <h1 class="studio-name">Estudio HZ</h1>
    <p class="studio-sub">Arquitectura &amp; Interiorismo · Buenos Aires</p>
  </header>
  <div class="divider"></div>
  <p class="tagline">Spaces that don't exist yet.</p>
  <nav class="links">
    <a class="link-item" href="https://www.behance.net/hzarchstudio" target="_blank">
      <div><div class="link-label">Proyectos</div><div class="link-desc">Portfolio · Behance</div></div>
      <span class="arrow">↗</span>
    </a>
    <a class="link-item" href="https://www.instagram.com/estudiohz_" target="_blank">
      <div><div class="link-label">Instagram</div><div class="link-desc">@estudiohz_</div></div>
      <span class="arrow">↗</span>
    </a>
    <a class="link-item" href="https://wa.me/541164675558" target="_blank">
      <div><div class="link-label">Contacto</div><div class="link-desc">Consultas y proyectos</div></div>
      <span class="arrow">↗</span>
    </a>
  </nav>
  <div class="contact-section">
    <p class="contact-label">Buenos Aires, Argentina</p>
    <div><a class="instagram-link" href="https://www.instagram.com/estudiohz_" target="_blank">@estudiohz_</a></div>
  </div>
  <footer><p class="footer-text">© 2026 Estudio HZ — Hernán Ortiz</p></footer>
</div>
</body>
</html>
