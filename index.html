<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio HZ - Arquitectura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #eeeeee;
        }

        header h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .proyecto {
            margin-bottom: 60px;
        }

        .proyecto-titulo {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .proyecto-descripcion {
            font-size: 14px;
            color: #666666;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .galeria-proyecto {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .galeria-proyecto img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            color: #888888;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>
<body>

    <header>
        <h1>Estudio HZ</h1>
    </header>

    <main>
        <section class="proyecto" id="cazal-235">
            <h2 class="proyecto-titulo">Cazal 235</h2>
            <div class="proyecto-descripcion">
                <p>Proyecto y dirección de obra. Desarrollo residencial unifamiliar.</p>
            </div>
            
            <div class="galeria-proyecto">
                <img src="images/cazal-235/01.jpg" alt="Cazal 235 - Fachada">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Estudio HZ. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
