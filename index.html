<script>
  const projectData = {
    project1: {
      title: "CS 85",
      meta: "Buenos Aires · Vivienda unifamiliar",
      desc: "Desarrollo de proyecto residencial enfocado en la integración volumétrica y optimización de luz natural.",
      images: ["images/proyecto1.jpg"]
    },
    project2: {
      title: "Chacras de la Reserva 156",
      meta: "Buenos Aires · Vivienda unifamiliar",
      desc: "Propuesta arquitectónica de una sola planta en entorno suburbano con patios internos.",
      images: ["images/proyecto2.jpg"]
    },
    project3: {
      title: "Bali Ecoislandia - Escobar",
      meta: "Escobar · Vivienda unifamiliar",
      desc: "Anteproyecto residencial sustentable con integración de paisaje.",
      images: ["images/proyecto3.jpg"]
    },
    project4: {
      title: "Lujan L4",
      meta: "Luján · Vivienda unifamiliar",
      desc: "Diseño conceptual y legajo técnico de vivienda moderna.",
      images: ["images/proyecto4.jpg"]
    },
    project5: {
      title: "Barrio Alameda Lote 244",
      meta: "Buenos Aires · Vivienda unifamiliar",
      desc: "Estudio de fachadas e interiorismo integrado para proyecto en barrio cerrado.",
      images: ["images/proyecto5.jpg"]
    },
    project6: {
      title: "Barrio Cazal - Diseño Residencial",
      meta: "Buenos Aires · Vivienda unifamiliar",
      desc: "Visualización 3D y diseño espacial de vivienda contemporánea en entorno natural.",
      images: [
        "images/cazal-235/01.jpg",
        "images/cazal-235/02.jpg",
        "images/cazal-235/04.jpg",
        "images/cazal-235/06.jpg",
        "images/cazal-235/07.jpg",
        "images/cazal-235/08.jpg",
        "images/cazal-235/09.jpg"
      ]
    }
  };

  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('projectModal');
    const closeBtn = document.getElementById('modalCloseBtn');
    const projectsGrid = document.getElementById('projectsGrid');

    projectsGrid.addEventListener('click', (e) => {
      const card = e.target.closest('.project');
      if(!card) return;

      const id = card.getAttribute('data-id');
      const data = projectData[id];
      if(!data) return;

      document.getElementById('modalTitle').innerText = data.title;
      document.getElementById('modalMeta').innerText = data.meta;
      document.getElementById('modalDesc').innerText = data.desc;

      const galleryContainer = document.getElementById('modalGallery');
      galleryContainer.innerHTML = '';
      data.images.forEach(imgUrl => {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = data.title;
        img.onerror = () => { img.style.display = 'none'; };
        galleryContainer.appendChild(img);
      });

      const cta = document.getElementById('modalCta');
      const encodedText = encodeURIComponent(`Hola! Vi el proyecto ${data.title} en tu web y quiero consultar por algo similar.`);
      cta.href = `https://wa.me/5491164675558?text=${encodedText}`;

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if(e.target === modal) closeModal();
    });

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }
  });
</script>
